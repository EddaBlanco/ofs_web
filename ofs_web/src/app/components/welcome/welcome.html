<!-- Hero de inicio: fondo espacial, título principal y decoración -->
<section class="space-bg" aria-labelledby="hero-title">
  <div class="stars stars-sm" [ngStyle]="{'box-shadow': small}" aria-hidden="true"></div>
  <div class="stars stars-md" [ngStyle]="{'box-shadow': medium}" aria-hidden="true"></div>
  <div class="stars stars-lg" [ngStyle]="{'box-shadow': big}" aria-hidden="true"></div>

  <div class="planet planet-sun" aria-hidden="true"></div>
  <div class="planet planet-moon" aria-hidden="true"></div>

  <div class="hero-content">
    <p class="pre-welcome">Descubre el</p>
    <h1 id="hero-title" class="observatory-title">
      <span class="observatory-title-main">Observatorio</span>
      <span class="observatory-title-name">Francisco Sánchez</span>
    </h1>
    <a class="hero-scroll" href="#quienes-somos">
      Conocer el observatorio
      <span class="hero-scroll-icon" aria-hidden="true">↓</span>
    </a>
  </div>
</section>
