<figure class="rt-animacion" [class.pausada]="pausada">
  <button type="button"
          class="rt-toggle"
          [attr.aria-pressed]="pausada"
          [attr.aria-label]="pausada ? 'Reanudar la animación' : 'Pausar la animación'"
          (click)="alternarAnimacion()">
    {{ pausada ? '▶ Reanudar' : '❚❚ Pausar' }}
  </button>

  <div class="rt-scroll">
    <svg class="rt-svg" viewBox="0 0 900 365" role="img" aria-labelledby="rt-titulo rt-desc">
    <title id="rt-titulo">Cómo funciona el radiotelescopio</title>
    <desc id="rt-desc">
      Esquema animado: un átomo de hidrógeno en el espacio profundo emite una señal de
      1420,405 MHz; la onda llega a la antena de bocina, pasa por el LNA y el SDR, y el
      espectro aparece en el ordenador.
    </desc>

    <defs>
      <radialGradient id="rt-vialactea" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7fc4f5" stop-opacity="0.16" />
        <stop offset="100%" stop-color="#7fc4f5" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="rt-metal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e3ebf6" />
        <stop offset="55%" stop-color="#a9b7c9" />
        <stop offset="100%" stop-color="#6e7a8c" />
      </linearGradient>
      <filter id="rt-brillo" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="desenfoque" />
        <feMerge>
          <feMergeNode in="desenfoque" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <marker id="rt-flecha" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#3498db" />
      </marker>
    </defs>

    <!-- Fondo -->
    <rect width="900" height="365" fill="#0d0d18" />
    <ellipse cx="205" cy="175" rx="250" ry="66" fill="url(#rt-vialactea)"
             transform="rotate(-18 205 175)" />

    <!-- Estrellas -->
    <circle *ngFor="let estrella of estrellas"
            class="rt-estrella"
            [attr.cx]="estrella.cx"
            [attr.cy]="estrella.cy"
            [attr.r]="estrella.r"
            [style.animation-delay]="estrella.retraso + 's'" />

    <text x="24" y="34" class="rt-label rt-label-small rt-ocultable">Espacio profundo</text>

    <!-- Átomo de hidrógeno -->
    <g>
      <circle cx="150" cy="150" r="30" fill="none" stroke="#2f4a6b"
              stroke-width="1.5" stroke-dasharray="3 6" />
      <g class="rt-orbita">
        <circle cx="150" cy="120" r="4.5" fill="#7fc4f5" filter="url(#rt-brillo)" />
      </g>
      <circle class="rt-destello" cx="150" cy="150" r="16" fill="#7fc4f5" />
      <circle class="rt-nucleo" cx="150" cy="150" r="11" fill="#ff8a5c" />
      <text x="150" y="154" text-anchor="middle" class="rt-label rt-label-fuerte">H</text>
      <text x="150" y="102" text-anchor="middle" class="rt-label rt-ocultable">Átomo de hidrógeno</text>
    </g>

    <!-- Onda emitida (1420,405 MHz) -->
    <text x="402" y="116" text-anchor="middle" class="rt-label rt-ocultable">
      1420,405 MHz · 21 cm
    </text>
    <g transform="translate(190 150)">
      <g *ngFor="let foton of fotones"
         class="rt-foton"
         [style.animation-delay]="foton + 's'">
        <path d="M0 0 q 7 -9 14 0 t 14 0 t 14 0 t 14 0" filter="url(#rt-brillo)" />
      </g>
    </g>

    <!-- Haz de la antena -->
    <path d="M620 75 L470 38 M620 225 L470 302"
          stroke="#3498db" stroke-width="1" stroke-dasharray="4 8" opacity="0.22" />

    <!-- Soporte y suelo -->
    <line x1="430" y1="330" x2="890" y2="330" stroke="#2c2c3e" stroke-width="2" />
    <g stroke="#3d4757" stroke-width="5" stroke-linecap="round">
      <line x1="660" y1="202" x2="660" y2="330" />
      <line x1="660" y1="272" x2="615" y2="330" />
      <line x1="660" y1="272" x2="705" y2="330" />
    </g>

    <!-- Antena de bocina -->
    <rect x="700" y="125" width="26" height="24" rx="3" fill="#55627a" />
    <polygon points="620,75 700,120 700,180 620,225"
             fill="url(#rt-metal)" stroke="#93a2b8" stroke-width="2" stroke-linejoin="round" />
    <polygon points="620,75 636,84 636,216 620,225" fill="#c3cfdf" opacity="0.5" />
    <text x="655" y="52" text-anchor="middle" class="rt-label rt-ocultable">Antena de bocina</text>
    <text x="735" y="346" text-anchor="middle" class="rt-label rt-label-small">OFS</text>

    <!-- Cadena de recepción -->
    <line x1="790" y1="137" x2="800" y2="137" stroke="#3498db" stroke-width="1.5" />
    <rect x="726" y="115" width="64" height="44" rx="6"
          fill="#242434" stroke="#3498db" stroke-width="1.5" />
    <text x="758" y="142" text-anchor="middle" class="rt-label">LNA</text>
    <rect x="800" y="115" width="64" height="44" rx="6"
          fill="#242434" stroke="#3498db" stroke-width="1.5" />
    <text x="832" y="142" text-anchor="middle" class="rt-label">SDR</text>

    <path d="M832 159 L832 244" stroke="#3498db" stroke-width="1.5" marker-end="url(#rt-flecha)" />

    <!-- Ordenador con el espectro -->
    <rect x="790" y="250" width="84" height="52" rx="6" fill="#1a1a28" stroke="#3d4757" />
    <rect x="796" y="256" width="72" height="34" rx="3" fill="#07070f" />
    <polyline class="rt-espectro"
              points="799,286 808,283 816,287 824,281 830,284 835,279 839,266 843,261 847,272 852,283 860,284 865,281" />
    <circle class="rt-pico" cx="843" cy="261" r="3" fill="#7fc4f5" />
    <rect x="824" y="302" width="16" height="16" fill="#3d4757" />
    <line x1="806" y1="326" x2="858" y2="326" stroke="#3d4757" stroke-width="3" stroke-linecap="round" />
    <text x="782" y="276" text-anchor="end" class="rt-label">PC</text>
  </svg>
  </div>

  <figcaption class="rt-caption">
    Esquema del funcionamiento: el hidrógeno neutro emite a 1420,405 MHz, la antena de bocina
    recoge la señal y el espectro se obtiene en el ordenador.
  </figcaption>
</figure>
