<div class="container">
	<h2 class="text-white">Estación meteorológica</h2>

	<form (ngSubmit)="queryData()" class="mb-3">
		<div class="row g-2 align-items-end">
			<div class="col-auto">
				<label class="form-label text-white">Station ID</label>
				<input class="form-control" [(ngModel)]="stationId" name="stationId" />
			</div>
			<div class="col-auto">
				<label class="form-label text-white">Timezone</label>
				<input class="form-control" [(ngModel)]="timezone" name="timezone" />
			</div>
			<div class="col-auto">
				<label class="form-label text-white">Start</label>
				<input type="datetime-local" class="form-control" [(ngModel)]="startTime" name="startTime" />
			</div>
			<div class="col-auto">
				<label class="form-label text-white">End</label>
				<input type="datetime-local" class="form-control" [(ngModel)]="endTime" name="endTime" />
			</div>
			<div class="col-auto">
				<label class="form-label text-white">Granularity</label>
				<select class="form-select" [(ngModel)]="granularity" name="granularity">
					<option value="raw">raw</option>
					<option value="hour">hour</option>
					<option value="day">day</option>
					<option value="month">month</option>
					<option value="year">year</option>
				</select>
			</div>
			<div class="col-auto">
				<label class="form-label text-white">Fields</label>
				<input class="form-control" [(ngModel)]="fields" name="fields" />
			</div>
			<div class="col-auto">
				<button class="btn btn-primary" type="button" (click)="queryData()">Consultar</button>
			</div>
		</div>
	</form>

	<div *ngIf="loading" class="text-white">Cargando...</div>
	<div *ngIf="error" class="text-danger">{{ error }}</div>

	<div *ngIf="data?.length">
		<h4 class="text-white mt-3">Resultados ({{ data.length }})</h4>
		<div class="table-responsive">
			<table class="table table-dark table-striped">
				<thead>
					<tr>
						<th>start_time</th>
						<th>end_time</th>
						<th *ngFor="let f of (fields.split(',') )">{{ f }}</th>
					</tr>
				</thead>
				<tbody>
					<tr *ngFor="let row of data">
						<td>{{ row.start_time }}</td>
						<td>{{ row.end_time }}</td>
						<td *ngFor="let f of (fields.split(',') )">{{ row[f] }}</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
