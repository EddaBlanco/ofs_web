<div class="container-fluid px-2 px-md-3">
	<h2 class="text-white mt-2 mb-3">Estación meteorológica</h2>

	<div class="row g-2">
		<!-- Columna izquierda: Controles y resultados -->
		<div class="col-12 col-lg-9 order-lg-1">
			<form (ngSubmit)="queryData()" class="mb-3">
				<div class="row g-2 align-items-end">
					<div class="col-12 col-sm-6 col-md-auto">
						<label class="form-label text-white form-label-sm">Timezone</label>
						<input class="form-control form-control-sm" [(ngModel)]="timezone" name="timezone" />
					</div>
					<div class="col-12 col-sm-6 col-md-auto">
						<label class="form-label text-white form-label-sm">Start</label>
						<input type="datetime-local" class="form-control form-control-sm" [(ngModel)]="startTime" name="period_start" />
					</div>
					<div class="col-12 col-sm-6 col-md-auto">
						<label class="form-label text-white form-label-sm">End</label>
						<input type="datetime-local" class="form-control form-control-sm" [(ngModel)]="endTime" name="period_end" />
					</div>
					<div class="col-12 col-sm-6 col-md-4">
						<label class="form-label text-white form-label-sm">Granularity</label>
						<select class="form-select form-select-sm" [(ngModel)]="granularity" (change)="onGranularityChange()" name="granularity">
							<option value="raw">raw</option>
							<option value="hour">hour</option>
							<option value="day">day</option>
							<option value="month">month</option>
							<option value="year">year</option>
						</select>
					</div>

					<div class="col-12 text-center text-md-end">
						<label class="form-label text-white d-block mb-2 form-label-sm">Campos</label>
						<div class="d-flex gap-2 flex-wrap justify-content-center justify-content-md-end">
							<button type="button" class="btn btn-sm btn-secondary" (click)="showFilters = !showFilters">
								<i class="fas fa-filter"></i> Filtros
							</button>
							<button type="button" class="btn btn-sm btn-success" (click)="selectAllFields()">Todos</button>
							<button type="button" class="btn btn-sm btn-danger" (click)="clearAllFields()">Limpiar</button>
						</div>
					</div>

					<!-- Desplegable de filtros -->
					<div class="col-12" *ngIf="showFilters">
						<div class="card bg-dark border-secondary p-3">
							<div *ngFor="let category of availableCategories" class="mb-3">
								<div class="text-info fw-bold mb-2">{{ category }}</div>
								<div class="fields-group">
									<div *ngFor="let field of getFieldsByCategory(category)" class="form-check">
										<input
											type="checkbox"
											class="form-check-input"
											[id]="'field_' + field"
											[checked]="selectedFields.includes(field)"
											(change)="toggleField(field)"
										/>
										<label class="form-check-label text-white" [for]="'field_' + field">
											{{ field }}
										</label>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="col-12">
						<button class="btn btn-primary w-100" type="submit">Consultar</button>
					</div>
				</div>
			</form>

			<div *ngIf="loading" class="text-white">Cargando...</div>
			<div *ngIf="error" class="text-danger">{{ error }}</div>

			<div *ngIf="data.length > 0">
				<h4 class="text-white mt-3 text-center text-md-start"><i class="fas fa-chart-line"></i> Resultados ({{ data.length }})</h4>
				<div class="row g-2">
					<div *ngFor="let row of data; let i = index" class="col-12 col-sm-6 col-lg-4">
						<div class="card bg-dark border-secondary h-100">
							<div class="card-header bg-secondary p-2 text-dark fw-bold">
								<i class="fas fa-arrow-right"></i>
								{{ row.start_time }}
							</div>
							<div class="card-body p-3">
								<div *ngFor="let key of getDataKeys(row)" class="mb-2">
									<div class="text-info small fw-bold">{{ key }}</div>
									<div class="text-white">{{ row[key] ?? 'N/A' }}</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Columna derecha: Widget de datos actuales -->
		<div class="col-12 col-lg-3 order-lg-2">
			<div class="card bg-dark border-secondary p-3 sticky-top" style="top:1rem">
				<h5 class="text-white text-center text-lg-start">
					<i class="fas fa-gauge-high"></i> Datos actuales
				</h5>
				<div *ngIf="loadingWidget" class="text-white text-center">
					<small class="text-muted">Cargando...</small>
				</div>
				<div *ngIf="!loadingWidget && latestData">
					<div *ngFor="let k of getDataKeys(latestData)" class="mb-2">
						<div class="text-info small fw-bold">{{ k }}</div>
						<div class="text-white">{{ latestData[k] ?? 'N/A' }}</div>
					</div>
					<div class="text-muted small mt-2 text-center">
						{{ latestData.start_time }}
					</div>
				</div>
				<div *ngIf="!loadingWidget && !latestData" class="text-muted small text-center">
					No hay datos disponibles.
				</div>
				<div class="mt-3">
					<button class="btn btn-sm btn-outline-primary w-100" (click)="fetchLatestWidgetData()">
						<i class="fas fa-sync-alt"></i> Actualizar
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
