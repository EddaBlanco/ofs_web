<div class="container-fluid">
	<h2 class="text-white">Estación meteorológica</h2>

	<div class="row">
		<!-- Columna izquierda: Controles y resultados -->
		<div class="col-12 col-lg-9">
			<form (ngSubmit)="queryData()" class="mb-3">
				<div class="row g-2 align-items-end">
					<div class="col-auto">
						<label class="form-label text-white">Timezone</label>
						<input class="form-control" [(ngModel)]="timezone" name="timezone" />
					</div>
					<div class="col-auto">
						<label class="form-label text-white">Start</label>
						<input type="datetime-local" class="form-control" [(ngModel)]="startTime" name="period_start" />
					</div>
					<div class="col-auto">
						<label class="form-label text-white">End</label>
						<input type="datetime-local" class="form-control" [(ngModel)]="endTime" name="period_end" />
					</div>
					<div class="col-12 col-md-4">
						<label class="form-label text-white">Granularity</label>
						<select class="form-select" [(ngModel)]="granularity" (change)="onGranularityChange()" name="granularity">
							<option value="raw">raw</option>
							<option value="hour">hour</option>
							<option value="day">day</option>
							<option value="month">month</option>
							<option value="year">year</option>
						</select>
					</div>

					<div class="col-12 col-md-8 text-end">
						<label class="form-label text-white d-block mb-2">Campos disponibles</label>
						<div class="btn-group">
							<button type="button" class="btn btn-secondary" (click)="showFilters = !showFilters">
								<i class="fas fa-filter"></i> Filtros
							</button>
							<button type="button" class="btn btn-sm btn-success" (click)="selectAllFields()">Seleccionar todos</button>
							<button type="button" class="btn btn-sm btn-danger" (click)="clearAllFields()">Deseleccionar</button>
						</div>
					</div>

					<!-- Desplegable de filtros -->
					<div class="col-12" *ngIf="showFilters">
						<div class="card bg-dark border-secondary p-3">
							<div *ngFor="let category of availableCategories" class="mb-3">
								<div class="text-info fw-bold mb-2">{{ category }}</div>
								<div class="fields-group">
									<div *ngFor="let field of getFieldsByCategory(category)" class="form-check">
										<input
											type="checkbox"
											class="form-check-input"
											[id]="'field_' + field"
											[checked]="selectedFields.includes(field)"
											(change)="toggleField(field)"
										/>
										<label class="form-check-label text-white" [for]="'field_' + field">
											{{ field }}
										</label>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="col-12">
						<button class="btn btn-primary w-100" type="submit">Consultar</button>
					</div>
				</div>
			</form>

			<div *ngIf="loading" class="text-white">Cargando...</div>
			<div *ngIf="error" class="text-danger">{{ error }}</div>

			<div *ngIf="data.length > 0">
				<h4 class="text-white mt-3">Resultados ({{ data.length }} mediciones)</h4>
				<div class="results-accordion">
					<div *ngFor="let row of data; let i = index" class="accordion-item card bg-dark border-secondary mb-2">
						<button
							class="accordion-header btn btn-dark w-100 text-start p-3 border-0"
							(click)="toggleExpanded(i)"
							type="button"
						>
							<span class="text-info fw-bold">
								{{ row.start_time }} <span class="text-muted">→</span> {{ row.end_time }}
							</span>
							<span class="float-end">
								<i class="fas" [ngClass]="expandedIndex === i ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
							</span>
						</button>

						<div *ngIf="expandedIndex === i" class="accordion-body p-4 bg-darker border-top border-secondary">
							<div class="data-fields">
								<div *ngFor="let key of getDataKeys(row)" class="data-field mb-3">
									<div class="field-name text-info fw-bold">{{ key }}:</div>
									<div class="field-value text-white ps-3">{{ row[key] ?? 'N/A' }}</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Columna derecha: Widget de datos actuales -->
		<div class="col-12 col-lg-3">
			<div class="card bg-dark border-secondary p-3 sticky-top" style="top:1rem">
				<h5 class="text-white">
					<i class="fas fa-gauge-high"></i> Datos actuales
				</h5>
				<div *ngIf="loadingWidget" class="text-white">
					<small class="text-muted">Cargando...</small>
				</div>
				<div *ngIf="!loadingWidget && latestData">
					<div *ngFor="let k of getDataKeys(latestData)" class="mb-2">
						<div class="text-info small fw-bold">{{ k }}</div>
						<div class="text-white">{{ latestData[k] ?? 'N/A' }}</div>
					</div>
					<div class="text-muted small mt-2">
						{{ latestData.start_time }} → {{ latestData.end_time }}
					</div>
				</div>
				<div *ngIf="!loadingWidget && !latestData" class="text-muted small">
					No hay datos actuales disponibles.
				</div>
				<div class="mt-3">
					<button class="btn btn-sm btn-outline-primary w-100" (click)="fetchLatestWidgetData()">
						<i class="fas fa-sync-alt"></i> Actualizar
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
